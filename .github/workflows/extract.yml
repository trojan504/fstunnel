name: Extract FsTunnel ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p fstunnel-3.0.0
          unzip -oq fstunnel-3.0.0.zip -d fstunnel-3.0.0

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fstunnel-3.0.0/
          git commit -m "Extract FsTunnel 3.0.0" || exit 0
          git push
